# Default values for mcp-timescale.
# This chart ships secure-by-default: hardened SecurityContext, no
# ServiceAccount token, ServiceMonitor on, OAuth required. The server acts
# on the caller's identity (forwarded OIDC tokens), holds only read-only
# database credentials and never mutates anything.

image:
  # -- Image repository.
  repository: gsoci.azurecr.io/giantswarm/mcp-timescale
  # -- Image tag; defaults to .Chart.AppVersion.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Replica count. One is enough with forwarded tokens (no OAuth state is
# shared); for more than one replica with interactive logins set
# storage.kind to valkey.
replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  port: 8080
  metricsPort: 9091

ingress:
  enabled: false
  className: ""
  host: ""
  tls:
    enabled: false
    secretName: ""

# -- Databases the server may connect to. Each entry becomes one database in
# databases.yaml; credentials come from a Secret mounted read-only (for a
# Zalando postgres-operator cluster that is the
# <role>.<cluster>.credentials.postgresql.acid.zalan.do Secret of a reader
# role). Optional keys: description, port (5432), sslmode (require),
# sslRootCertSecretRef {name, key} for verify-ca/verify-full, allowedGroups,
# allowedUsers (empty = every authenticated caller), maxRows (500, max 5000),
# statementTimeout (30s), maxConnections (4).
databases: []
# databases:
#   - name: demo
#     description: Factory demo data
#     host: timescale-demo-repl.timescale-demo.svc.cluster.local
#     port: 5432
#     dbname: timescaledb
#     sslmode: require
#     secretRef:
#       name: timescaledb-data-reader-user.timescale-demo.credentials.postgresql.acid.zalan.do
#       usernameKey: username
#       passwordKey: password
#     allowedGroups: []
#     allowedUsers: []
#     maxRows: 500
#     statementTimeout: 30s
#     maxConnections: 4

# OAuth gates the /mcp endpoint. Disable only for stdio-only deployments.
# Every knob below maps to an OAUTH_* env var consumed by mcp-oauth's
# oauthconfig package — see https://pkg.go.dev/github.com/giantswarm/mcp-oauth/oauthconfig.
oauth:
  enabled: true
  # Identity provider. dex | google | github. Template ships dex; switching
  # to google/github also requires populating the matching values block
  # below (not provided by default — add it inline if needed).
  provider: dex
  # OAuth issuer for THIS server (its own /oauth/* endpoints). Loopback
  # values (http://localhost, http://127.0.0.1, http://[::1]) are accepted
  # without setting allowInsecureHTTP — see RFC 8252 §7.3.
  issuerURL: ""
  audience: "mcp-timescale"
  scopes:
    - openid
    - email
    - groups
  # When true, pre-flights with http:// issuers other than the loopback
  # exception above. Off by default; flip only for a private-network test
  # rig you control end-to-end.
  allowInsecureHTTP: false
  # When true, accepts http://127.0.0.1 / http://[::1] redirect URIs from
  # public clients (RFC 8252 native-app loopback). Required for desktop
  # IDE clients that loop back to a localhost callback.
  allowLocalhostRedirectURIs: false
  # -- When true, the Dex issuer and its JWKS endpoint may resolve to private
  # (RFC 1918), loopback or link-local addresses: a management cluster whose
  # Dex sits behind an internal-only load balancer. Lifts mcp-oauth's SSRF
  # guard for exactly these two operator-configured endpoints (nothing else
  # may reach private addresses) and keeps TLS verification on. Without it
  # every forwarded token is refused there because the JWKS fetch fails.
  # Rendered as OAUTH_ALLOW_PRIVATE_URLS; the same knob as allowPrivateURLs
  # on mcp-kubernetes, mcp-capi and mcp-prometheus.
  allowPrivateURLs: false
  # Dex provider config. The redirect URL is auto-derived from issuerURL
  # ("${issuerURL}/oauth/callback").
  dex:
    issuerURL: ""
    clientIDSecretRef:
      name: ""
      key: client-id
    clientSecretSecretRef:
      name: ""
      key: client-secret
  # -- Trusted audiences for SSO token forwarding (RFC 8693): the Dex client
  # IDs whose ID tokens muster forwards (auth.mode forward). Each entry must
  # match [a-zA-Z0-9_-]{1,256}.
  trustedAudiences: []
  # URI schemes accepted during public client registration without a
  # registration access token (e.g., cursor, vscode).
  trustedRedirectSchemes: []
  # Optional 32-byte AES-GCM key for encrypting tokens at rest. Accepts
  # base64 (canonical) or hex. When unset, tokens are stored in plaintext.
  encryptionKeySecretRef:
    name: ""
    key: encryption-key
  # Optional 32-byte HMAC key for derived session IDs. When unset,
  # mcp-oauth falls back to SHA-256 derivation.
  sessionIDHMACKeySecretRef:
    name: ""
    key: session-id-hmac-key

storage:
  # -- OAuth state store. memory: per-pod, lost on restart, not shared across
  # replicas — sufficient when clients arrive with forwarded tokens (muster).
  # valkey: required for replicas > 1 with interactive logins.
  kind: memory
  valkey:
    address: ""
    passwordSecretRef:
      name: ""
      key: password
    tls: true

# Gateway API HTTPRoute for the public hostname (Envoy Gateway). The route
# forwards / so /mcp, /oauth/* and /.well-known/* share the Service.
gatewayAPI:
  enabled: false
  httpRoute:
    # Required when enabled, e.g.
    #   - name: giantswarm-default
    #     namespace: envoy-gateway-system
    parentRefs: []
    hostnames: []
    labels: {}  # @schema additionalProperties: true
    annotations: {}  # @schema additionalProperties: true
  backendTrafficPolicy:
    # Envoy Gateway BackendTrafficPolicy; 0s disables the request timeout
    # that would otherwise cut long-lived MCP streams.
    enabled: false
    timeout: "0s"
    labels: {}  # @schema additionalProperties: true
    annotations: {}  # @schema additionalProperties: true

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels: {}  # @schema additionalProperties: true

# -- NetworkPolicy with default-deny egress (DNS + egressAllowlist only).
# Off by default because the databases and Dex are reached by DNS name and a
# NetworkPolicy cannot express that; when enabling it, allow TCP 5432 to the
# database namespaces and TCP 443 for Dex JWKS. Example:
#   egressAllowlist:
#     - to:
#         - namespaceSelector:
#             matchLabels: {kubernetes.io/metadata.name: timescale-demo}
#       ports:
#         - protocol: TCP
#           port: 5432
#     - to:
#         - ipBlock: {cidr: 0.0.0.0/0}
#       ports:
#         - protocol: TCP
#           port: 443
networkPolicy:
  enabled: false
  egressAllowlist: []

# -- PodDisruptionBudget. Off by default because replicas is 1 (minAvailable
# 1 would block node drains); enable together with replicas >= 2.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# OTEL endpoint. Empty disables tracing entirely.
otel:
  endpoint: ""
  protocol: http/protobuf  # or grpc

# -- Any additional non-secret env vars.
extraEnv: []
# -- Any Secret refs to mount as env vars ({envName, name, key}).
extraEnvFromSecretRefs: []

# Pod-level security context. Hardened by default.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

# Container-level security context.
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: ""
  annotations: {}  # @schema additionalProperties: true
  # -- The server never talks to the Kubernetes API; no token is mounted.
  automountServiceAccountToken: false

nodeSelector: {}  # @schema additionalProperties: true
tolerations: []
affinity: {}  # @schema additionalProperties: true
topologySpreadConstraints: []

nameOverride: ""
fullnameOverride: ""
